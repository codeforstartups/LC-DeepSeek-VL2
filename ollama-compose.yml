version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./start-ollama.sh:/start-ollama.sh
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_GPU: 0              # Force CPU usage
      OLLAMA_NUM_GPU_LAYERS: 0       # Use CPU for inference
      OLLAMA_KEEP_ALIVE: "5m"        # Keep model loaded for 5 minutes
    # runtime: nvidia               # Commented out - using CPU instead
    entrypoint: ["/start-ollama.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_DB: langchain_dev
      POSTGRES_USER: langchain_user
      POSTGRES_PASSWORD: langchain_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langchain_user -d langchain_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
    name: ollama_data
  postgres_data:
    driver: local
